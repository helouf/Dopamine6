workflows:
  dopamine-build:
    name: Dopamine Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
      cancel_previous_builds: true
    environment:
      cache_paths: []
      vars:
        NIGHTLY: "0"
        BUILD_STANDALONE: "0"
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          brew install ldid libarchive ossp-uuid dpkg
          
          # Build and install trustcache from source using OpenSSL
          cd /tmp
          git clone https://github.com/CRKatri/trustcache.git
          cd trustcache
          
          # Export CFLAGS/LDFLAGS so they're inherited by all make invocations
          export CFLAGS="-I/opt/homebrew/opt/openssl@3/include"
          export LDFLAGS="-L/opt/homebrew/opt/openssl@3/lib"
          
          # Build with OPENSSL=1
          make OPENSSL=1 || {
            echo "ERROR: trustcache build failed!"
            exit 1
          }
          
          # Verify the binary was built
          if [ ! -f trustcache ]; then
            echo "ERROR: trustcache binary not found after build!"
            exit 1
          fi
          
          sudo cp trustcache /usr/local/bin/trustcache
          sudo chmod +x /usr/local/bin/trustcache
          
          # Verify installation
          which trustcache || { echo "ERROR: trustcache not in PATH!"; exit 1; }
          ls -l /usr/local/bin/trustcache || { echo "ERROR: trustcache binary not found!"; exit 1; }
          
          cd $CM_BUILD_DIR
          
          # Install Theos
          export THEOS=~/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $CM_ENV
          echo "THEOS_MAKE_PATH=$THEOS/makefiles" >> $CM_ENV
          
          # Override SDK path to use available Xcode SDK
          SDKVERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "SDKVERSION=$SDKVERSION" >> $CM_ENV
          echo "SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path)" >> $CM_ENV
      
      - name: Set COMMIT_HASH if NIGHTLY=1
        script: |
          if [ "$NIGHTLY" = "1" ]; then
            export COMMIT_HASH=$(git rev-parse HEAD)
            echo "COMMIT_HASH=$COMMIT_HASH" >> $CM_ENV
          fi
      
      - name: Build BaseBin
        script: |
          cd $CM_BUILD_DIR/BaseBin
          # Remove prebuilt trustcache binary with broken dependencies
          # This will force the Makefile to use the one we built from source
          rm -f prebuilt/trustcache
          
          # Remove entire custom XPC directory (conflicts with iOS SDK's built-in XPC)
          # The iOS 26.5 SDK provides complete XPC headers, so the custom ones are not needed
          # This must be done before any builds that create .include directory
          rm -rf _external/include/xpc
          
          mkdir -p .build
          make ChOma XPF MachOMerger libjailbreak systemhook forkfix launchdhook hookd boomerang jbctl idownloadd watchdoghook rootlesshooks dopamine basebin.tc dyldhook basebin.tar
      
      - name: Build Packages
        script: |
          cd $CM_BUILD_DIR/Packages
          make
      
      - name: Build Application
        script: |
          cd $CM_BUILD_DIR/Application
          make
      
      - name: Build Standalone
        script: |
          cd $CM_BUILD_DIR/Standalone
          make
    
    artifacts:
      - BaseBin/basebin.tar
      - BaseBin/basebin.tc
      - Packages/*/*.deb
      - Application/Dopamine.ipa
      - Application/Dopamine.tipa
      - Standalone/Dopamine.tar

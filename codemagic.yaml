workflows:
  dopamine-build:
    name: Dopamine Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        NIGHTLY: "0"
        BUILD_STANDALONE: "0"
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          brew install ldid libarchive libmd
          
          # Install Theos
          export THEOS=~/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $CM_ENV
          echo "THEOS_MAKE_PATH=$THEOS/makefiles" >> $CM_ENV
          
          # Build trustcache natively for arm64 to match homebrew libmd architecture
          echo "Building trustcache for arm64..."
          cd $HOME
          git clone https://github.com/CRKatri/trustcache.git
          cd trustcache
          make clean
          make
          # Store absolute path to trustcache in CM_ENV
          TRUSTCACHE_PATH="$HOME/trustcache/trustcache"
          echo "TRUSTCACHE_PATH=$TRUSTCACHE_PATH" >> $CM_ENV
          echo "✓ trustcache built as arm64 native binary at $TRUSTCACHE_PATH"
          ls -la "$TRUSTCACHE_PATH" || { echo "ERROR: trustcache binary not found after build"; exit 1; }
          
          # Override SDK path to use available Xcode SDK
          SDKVERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "SDKVERSION=$SDKVERSION" >> $CM_ENV
          echo "SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path)" >> $CM_ENV
      
      - name: Set COMMIT_HASH if NIGHTLY=1
        script: |
          if [ "$NIGHTLY" = "1" ]; then
            export COMMIT_HASH=$(git rev-parse HEAD)
            echo "COMMIT_HASH=$COMMIT_HASH" >> $CM_ENV
          fi
      
      - name: Build BaseBin
        script: |
          # Copy trustcache to build directory where Makefile can find it
          cp "$TRUSTCACHE_PATH" $CM_BUILD_DIR/BaseBin/
          export PATH="$CM_BUILD_DIR/BaseBin:$PATH"
          
          # Verify trustcache is accessible
          which trustcache || { echo "ERROR: trustcache not in PATH"; exit 1; }
          trustcache --version || echo "trustcache ready"
          
          cd $CM_BUILD_DIR/BaseBin
          # Use pre-built opainject binary to avoid CoreSymbolication framework issues
          mkdir -p .build
          cp prebuilt/opainject .build/opainject
          # Build everything except opainject (trustcache is now arm64 native, no DYLD workaround needed)
          make ChOma XPF MachOMerger libjailbreak systemhook forkfix launchdhook hookd boomerang jbctl idownloadd watchdoghook rootlesshooks dopamine basebin.tc dyldhook basebin.tar
      
      - name: Build Packages
        script: |
          cd $CM_BUILD_DIR/Packages
          make
      
      - name: Build Application
        script: |
          cd $CM_BUILD_DIR/Application
          make
      
      - name: Build Standalone
        script: |
          cd $CM_BUILD_DIR/Standalone
          make
    
    artifacts:
      - BaseBin/basebin.tar
      - BaseBin/basebin.tc
      - Packages/*/*.deb
      - Application/Dopamine.ipa
      - Application/Dopamine.tipa
      - Standalone/Dopamine.tar
